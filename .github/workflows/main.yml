name: Weekly Extract

on:
  push:
    branches: ["main"]
    paths: ["tn_gazette_archiver.py", "scrape_gazettes.py", "scrape_ordinary.py",
            "archive_new_links.py", "tn_lib.py", "tests/**", "scripts/**",
            ".github/workflows/main.yml", "requirements.txt"]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  run:
    name: Scrape & Archive
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight — is the site reachable from this runner?
        id: preflight
        run: |
          if curl -sS -o /dev/null --max-time 20 \
              "https://www.stationeryprinting.tn.gov.in/gazette.php?id=MjAyNg=="; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::stationeryprinting.tn.gov.in is unreachable from this runner (the site blocks non-India IPs). Scrapes skipped, data not refreshed this run. Scraping requires an Indian vantage point - see README, 'Where scraping runs'."
          fi

      - name: Unit tests
        run: python -m pytest tests/ -q

      - name: Scrape extraordinary gazettes
        if: steps.preflight.outputs.reachable == 'true'
        timeout-minutes: 5
        run: python scrape_gazettes.py

      - name: Scrape ordinary gazettes (latest issues)
        if: steps.preflight.outputs.reachable == 'true'
        timeout-minutes: 20
        run: python scrape_ordinary.py

      - name: Dataset guard (all three families held or grew)
        if: steps.preflight.outputs.reachable == 'true'
        run: python scripts/assert_datasets.py

      - name: Rebuild site stats
        run: python scripts/build_site_stats.py

      - name: Archive unarchived PDF links to Wayback Machine
        timeout-minutes: 5
        continue-on-error: true
        run: python archive_new_links.py --delay 2

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Weekly scrape and Wayback archival"
          git push
